<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="bingbot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<title>YB @ XMF 2026 — KOREA × JAPAN · X REACTION ARCHIVE</title>
<style>
:root{
  --blue:#3237ff;
  --red:#ff2323;
  --ink:#101010;
  --muted:#6f7075;
  --line:#e6e6e9;
  --soft:#f7f7f8;
  --blueSoft:#eef0ff;
  --redSoft:#fff0f0;
  --shadow:0 8px 28px rgba(0,0,0,.06);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink)}
a{color:inherit}
button,input{font:inherit}
.wrap{max-width:1180px;margin:auto;padding:24px 22px 100px}

/* brand */
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.officialMark{width:260px;max-width:42vw;height:58px;object-fit:cover;object-position:center;border-radius:10px;display:block}
.siteName{text-align:right}
.siteName b{display:block;font-size:18px;letter-spacing:-.02em}
.siteName span{display:block;margin-top:3px;font-size:11px;font-weight:800;letter-spacing:.11em;color:#777}

/* hero */
.hero{padding:38px 0 22px}
.heroKicker{font-size:12px;font-weight:900;letter-spacing:.12em;color:#777}
.hero h1{font-size:48px;line-height:1;letter-spacing:-.055em;margin:8px 0 10px}
.hero p{margin:0;color:var(--muted);font-size:15px}
.slashes{display:flex;gap:5px;margin-top:18px}
.slashes i{display:block;width:54px;height:7px;transform:skew(-28deg)}
.slashes i:nth-child(1){background:var(--blue)}
.slashes i:nth-child(2){background:var(--red)}
.slashes i:nth-child(3){background:#111}

/* page tabs */
.pageTabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 18px}
.pageTab{border:1.5px solid #dcdce0;background:#fff;border-radius:15px;padding:15px 18px;font-weight:850;font-size:17px;cursor:pointer;transition:.16s transform,.16s box-shadow,.16s background}
.pageTab:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.pageTab.active.all{background:#111;color:#fff;border-color:#111}
.pageTab.active.kr{background:var(--blue);color:#fff;border-color:var(--blue)}
.pageTab.active.jp{background:var(--red);color:#fff;border-color:var(--red)}
.pageState{display:flex;align-items:center;gap:11px;margin:8px 0 20px;padding:13px 16px;border-radius:14px;font-weight:900;font-size:20px;background:#fafafa;border:1px solid var(--line)}
.pageState .pill{font-size:11px;letter-spacing:.08em;padding:5px 8px;border-radius:999px}
.pageState.kr .pill{background:var(--blueSoft);color:var(--blue)}
.pageState.jp .pill{background:var(--redSoft);color:var(--red)}
.pageState.all .pill{background:#eee;color:#111}

/* overview */
.overview{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:26px}
.stat{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;position:relative;overflow:hidden}.stat.krStat{border-top:4px solid var(--blue)}.stat.jpStat{border-top:4px solid var(--red)}.stat.krStat span,.stat.krStat b{color:var(--blue)}.stat.jpStat span,.stat.jpStat b{color:var(--red)}
.stat span{display:block;color:var(--muted);font-size:15px;font-weight:700;line-height:1.25}
.stat b{display:block;font-size:26px;margin-top:4px}

/* section */
section{padding:30px 0;border-top:1px solid var(--line)}
.secHead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.secHead h2{font-size:27px;margin:0;letter-spacing:-.035em}
.secHead p{margin:5px 0 0;color:var(--muted);font-size:14px}
.hint{font-size:12px;color:#8a8b90}

/* clickable affordance */
.clickable{cursor:pointer;transition:.14s transform,.14s box-shadow,.14s background,.14s border-color}
.clickable:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(0,0,0,.06);border-color:#cfcfd4}
.viewChip{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;background:#111;color:#fff;font-size:10px;font-weight:850;white-space:nowrap}
.viewChip,.staticCard .viewChip,.interestCard .viewChip,.listRow .viewChip,.rankItem .viewChip,.cta .viewChip{background:#111!important;color:#fff!important;opacity:1!important}

/* top reaction cards */
.countryCols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.countryPanel{border:1px solid var(--line);border-radius:20px;padding:18px;background:#fff}
.countryPanel.kr{box-shadow:inset 4px 0 0 var(--blue)}
.countryPanel.jp{box-shadow:inset 4px 0 0 var(--red)}
.countryTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.countryTitle b{font-size:20px}
.countryTag{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px}
.countryTag.kr{background:var(--blueSoft);color:var(--blue)}
.countryTag.jp{background:var(--redSoft);color:var(--red)}
.rankItem{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:12px 8px;border-top:1px solid #f0f0f1;border-radius:11px}
.rankItem:first-of-type{border-top:0}
.rankItem.clickable:hover{background:#fafafa}
.rankNo{font-size:18px;font-weight:900;color:#aaa}
.rankMain{font-weight:850;font-size:17px}
.rankSub{font-size:11px;color:#888;margin-top:2px}
.rankRight{display:flex;align-items:center;gap:8px}
.rankCount{font-size:13px;font-weight:850}

/* diverging comparison */
.detailBtn{margin-top:14px;border:1.5px solid #111;background:#fff;border-radius:13px;padding:11px 13px;font-weight:850;cursor:pointer;width:100%}
.detailBtn:hover{background:#111;color:#fff}
.detail{display:none;margin-top:16px}.detail.open{display:block}
.divHead{display:grid;grid-template-columns:1fr 140px 1fr;gap:12px;margin-bottom:6px;font-size:12px;font-weight:900}
.divHead .left{text-align:right;color:var(--blue)}
.divHead .right{text-align:left;color:var(--red)}
.divRow{display:grid;grid-template-columns:1fr 140px 1fr;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #f0f0f2}
.divSide{display:grid;align-items:center;gap:8px}
.divSide.left{grid-template-columns:auto 1fr}
.divSide.right{grid-template-columns:1fr auto}
.divSide.left .barShell{display:flex;justify-content:flex-end}
.barShell{height:14px;background:#f0f0f2;border-radius:999px;overflow:hidden}
.divSide.left .barShell{border-radius:999px}
.divFill{height:100%;border-radius:999px}
.divFill.kr{background:var(--blue)}.divFill.jp{background:var(--red)}
.divVal{font-size:12px;font-weight:850;white-space:nowrap}
.divVal small{color:#888;font-weight:600;margin-left:3px}
.divLabel{text-align:center;font-weight:900;font-size:15px}

/* CTA */
.ctas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cta{border:1px solid var(--line);border-radius:18px;padding:18px;position:relative}
.cta.kr{border-top:4px solid var(--blue)}.cta.jp{border-top:4px solid var(--red)}
.cta h3{margin:8px 0 5px;font-size:20px}.cta.kr h3{color:var(--blue)}.cta.jp h3{color:var(--red)}.cta p{margin:0;color:#666;line-height:1.5;font-size:14px}
.cta .go{position:absolute;right:16px;top:16px}

/* static country cards */
.staticGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.staticCard{border:1px solid var(--line);border-radius:15px;padding:15px;position:relative}
.staticCard b{display:block;font-size:25px;margin-top:6px}
.staticCard span{font-size:12px;color:#777}
.staticCard .go{position:absolute;right:12px;top:12px}

/* lists */
.list{display:flex;flex-direction:column}
.listRow{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:13px 8px;border-bottom:1px solid #eeeeef;border-radius:10px}
.listRow.clickable:hover{background:#fafafa}
.listIndex{font-weight:900;color:#aaa}.listMain{font-size:17px;font-weight:850}.listMeta{font-size:13px;color:#666}
.songActions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.actionBtn{border:1.5px solid #dcdce1;background:#fff;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:850;cursor:pointer}
.actionBtn:hover{background:#111;color:#fff;border-color:#111}
.moreBtn{margin-top:12px;border:1.5px solid #111;background:#fff;border-radius:12px;padding:10px 12px;font-weight:850;cursor:pointer}
.moreBtn:hover{background:#111;color:#fff}
.hidden{display:none}.hidden.open{display:block}

/* interest */
.interestGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.interestCard{border:1px solid var(--line);border-radius:15px;padding:15px;position:relative}
.interestCard b{display:block;font-size:26px;margin-top:6px}
.interestCard .go{position:absolute;right:11px;top:11px}

/* language */
.languagePairs{display:flex;flex-direction:column;gap:10px}
.languagePair{display:grid;grid-template-columns:1fr 140px 1fr;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.langSide{display:grid;gap:8px;align-items:center}
.langSide.left{grid-template-columns:auto 1fr}
.langSide.right{grid-template-columns:1fr auto}
.langSide.left .barShell{display:flex;justify-content:flex-end}
.langName{font-weight:850;white-space:nowrap}
.langMeta{font-size:11px;color:#777;margin-top:2px}
.langCenter{text-align:center;font-size:12px;color:#888;font-weight:800}
.langHit{padding:4px;border-radius:9px}

/* preview/tweets */
.preview{margin-top:18px;border-top:1px solid #ececee;padding-top:14px}
.previewTitle{font-size:13px;color:#666;margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px}
.tweet{border:1px solid var(--line);border-radius:16px;padding:15px;background:#fff}
.top{display:flex;gap:9px;align-items:center}
.avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff}
.avatar.kr{background:var(--blue)}.avatar.jp{background:var(--red)}
.name{font-weight:850}.handle{color:#777;font-size:13px}
.body{font-size:15px;line-height:1.55;white-space:pre-wrap;margin:11px 0;overflow-wrap:anywhere}
.linkish{color:#176ed0}
.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:11px;background:#f2f2f3;border-radius:999px;padding:4px 7px}
.mediaflag{display:inline-flex;margin:2px 0 9px;border:1px solid #ddd;border-radius:8px;padding:6px 9px;font-size:12px;background:#fafafa}
.orig{font-size:12px;color:#666;margin-top:9px}.orig .body{font-size:14px}
.tweetFooter{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid #f0f0f1}
.eng{color:#777;font-size:12px}
.xBtn{display:inline-flex;align-items:center;gap:5px;text-decoration:none;border:1.5px solid #111;background:#111;color:#fff;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:900;white-space:nowrap;width:max-content;flex:0 0 auto}
.xBtn:hover{opacity:.82}
.deadLink{font-size:11px;color:#aaa;font-weight:700}
.previewMore{margin-top:10px}

/* explorer */
.explorerTools{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.search{width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:12px}
.sortSelect{border:1.5px solid #d8d8dd;border-radius:12px;padding:11px 12px;background:#fff;font-weight:800}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin:11px 0}
.filterbar button{border:1px solid #ddd;background:#fff;border-radius:999px;padding:7px 11px;cursor:pointer;font-weight:750}
.filterbar button.active{background:#111;color:#fff;border-color:#111}
.allList .tweet{margin:10px 0}

@media(max-width:820px){
 .brandbar{align-items:flex-start}.officialMark{width:190px;height:46px}.siteName b{font-size:15px}.siteName span{font-size:9px}
 .hero h1{font-size:38px}.pageTabs{grid-template-columns:1fr}.overview{grid-template-columns:repeat(2,1fr)}
 .countryCols,.ctas{grid-template-columns:1fr}.staticGrid{grid-template-columns:1fr 1fr}.interestGrid{grid-template-columns:1fr 1fr}
 .divHead,.divRow,.languagePair{grid-template-columns:1fr}.divHead{display:none}.divLabel{order:-1;text-align:left}.langCenter{display:none}
 .cards{grid-template-columns:1fr}.explorerTools{grid-template-columns:1fr}
}

/* v7 refinements */
.brandbar{
  margin:-24px calc(50% - 50vw) 28px;
  padding:28px max(22px,calc((100vw - 1180px)/2 + 22px));
  background:#111;color:#fff;border:0;
  min-height:112px;align-items:center;
}
.siteName{text-align:left}
.siteName b{font-size:30px;letter-spacing:-.045em}
.siteName span{margin-top:7px;color:#bdbdc3;font-size:11px;letter-spacing:.14em}
.pageState{display:none!important}
.pageTabs{margin-top:4px}
.cardTakeaway,.listTakeaway,.rankSub{color:#707177;line-height:1.45}
.cardTakeaway{font-size:13px;margin:8px 90px 13px 0;min-height:38px}
.staticLabel{font-size:18px;font-weight:850}
.staticFoot{display:flex;align-items:baseline;gap:6px}
.staticCard b{display:inline;font-size:29px}
.staticCard span.unit{font-size:12px;color:#777}
.rankSub{font-size:12px;margin-top:4px;max-width:420px}
.listCopy{min-width:0}
.listTakeaway{font-size:12px;margin-top:4px;font-weight:500}
.actionBtn{background:#111;color:#fff;border-color:#111}
.actionBtn:hover{opacity:.82;background:#111}
.sectionTakeaway{font-size:14px;color:#5e6066;line-height:1.55;margin:0 0 16px}
.normList{display:flex;flex-direction:column;gap:14px}
.normRow{border:1px solid var(--line);border-radius:15px;padding:14px 15px;background:#fff}
.normTitle{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:9px}
.normLabel{font-weight:900;font-size:15px}
.normHint{font-size:11px;color:#8a8b90}
.normBar{height:22px;border-radius:999px;overflow:hidden;display:flex;position:relative;background:#f1f1f3}
.normSeg{height:100%;border:0;padding:0;cursor:pointer;transition:.15s filter,.15s opacity}
.normSeg:hover{filter:brightness(.9)}
.normSeg.kr{background:var(--blue)}
.normSeg.jp{background:var(--red)}
.normMid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.10);pointer-events:none}
.normMeta{display:flex;justify-content:space-between;gap:12px;margin-top:7px;font-size:11px;color:#777}
.normMeta .krTxt{color:var(--blue)}
.normMeta .jpTxt{color:var(--red);text-align:right}
.normNote{font-size:11px;color:#8a8b90;margin-top:10px}
.mediaflag{font-weight:700}
@media(max-width:820px){
 .brandbar{min-height:96px;margin-top:-24px}
 .siteName b{font-size:25px}.siteName span{font-size:9px}
 .staticGrid{grid-template-columns:1fr}
 .cardTakeaway{margin-right:0;padding-right:82px}
 .normTitle{align-items:flex-start}
}

.preview{scroll-margin-top:18px}
.toTop{display:none;position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:50;border:0;border-radius:999px;background:#111;color:#fff;font-weight:900;font-size:13px;padding:11px 14px;box-shadow:0 8px 24px rgba(0,0,0,.22);cursor:pointer;opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s opacity,.18s transform}
.toTop.show{opacity:1;transform:translateY(0);pointer-events:auto}
@media(max-width:820px){.toTop{display:block}}


/* v9 interaction + mobile UX */
.brandbar{justify-content:flex-start;gap:22px}
.brandIdentity{display:flex;align-items:center;gap:18px;min-width:0}
.brandLogo{display:block;width:108px;height:54px;object-fit:contain;object-position:left center;flex:0 0 auto}
.brandCross{font-size:22px;color:#6f7076;font-weight:400;line-height:1}
.brandYB{font-size:31px;font-weight:950;letter-spacing:-.06em;line-height:1;color:#fff;white-space:nowrap}
.siteName{border-left:1px solid #303036;padding-left:20px}
.clickable.isActive,.staticCard.isActive,.rankItem.isActive,.interestCard.isActive,.listRow.isActive{border-color:#111!important;background:#f7f7f8!important;box-shadow:0 0 0 1px #111 inset!important;transform:none!important}
.normSeg.isActive{filter:brightness(.72);box-shadow:inset 0 0 0 2px rgba(255,255,255,.9)}
.previewHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.previewTitle{margin-bottom:0}
.previewReturn{display:none;border:1px solid #d7d7dc;background:#fff;color:#111;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:850;cursor:pointer;white-space:nowrap}
.previewReturn:hover{border-color:#111}
.tweet.longTweet .bodyShort{display:block}
.tweet.longTweet .bodyFull{display:none}
.tweet.longTweet.expanded .bodyShort{display:none}
.tweet.longTweet.expanded .bodyFull{display:block}
.tweetExpand{display:none;margin-top:8px;border:0;background:transparent;padding:0;font-size:12px;font-weight:850;text-decoration:underline;cursor:pointer}
.tweet.longTweet .tweetExpand{display:inline-block}
.kwMark{background:#f2f2f3;color:inherit;font-weight:850;padding:0 .12em;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
@media(max-width:820px){
  .brandbar{min-height:104px;padding-top:24px;padding-bottom:24px;gap:14px}
  .brandIdentity{gap:10px}.brandLogo{width:74px;height:42px}.brandCross{font-size:16px}.brandYB{font-size:24px}
  .siteName{padding-left:13px}.siteName b{font-size:20px}.siteName span{font-size:8px;line-height:1.35}
  .pageTabs{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:8px 0;margin-top:0;border-bottom:1px solid var(--line)}
  .preview{scroll-margin-top:92px}.previewReturn{display:inline-flex;align-items:center}
  .normMeta{font-size:10px}.normHint{display:none}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}


/* v10 polish */
.logoCrop{overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.logoCrop img{display:block;max-width:none}
.xmfLogo{width:118px;height:54px;border-radius:2px}
.xmfLogo img{width:118px;height:118px;object-fit:cover;transform:scale(1.55)}
.ybLogo{width:58px;height:58px;border-radius:2px}
.ybLogo img{width:58px;height:58px;object-fit:cover;transform:scale(1.22)}
.compareLegend{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 12px;font-size:12px;font-weight:900}
.compareLegend .krL{color:var(--kr)} .compareLegend .jpL{color:var(--jp)}
.previewClose{display:flex;justify-content:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.previewCloseBtn{border:1px solid #d7d7dc;background:#fff;color:#111;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:900;cursor:pointer}
.previewCloseBtn:hover{border-color:#111;background:#f7f7f8}
@media(max-width:820px){
  .xmfLogo{width:88px;height:44px}.xmfLogo img{width:88px;height:88px;transform:scale(1.52)}
  .ybLogo{width:46px;height:46px}.ybLogo img{width:46px;height:46px;transform:scale(1.18)}
}


@media(max-width:420px){
  .tweetFooter{align-items:flex-end}
  .tweetFooter .eng{min-width:0;overflow-wrap:anywhere}
  .xBtn{padding:7px 9px;font-size:11px}
}
</style>
</head>
<body><div class="wrap">

function relevantIndexes(text){
 const low=String(text).toLowerCase(), idx=[];
 highlightTerms.forEach(term=>{
  const needle=String(term).toLowerCase();
  let pos=low.indexOf(needle);
  while(pos>=0){idx.push(pos);pos=low.indexOf(needle,pos+needle.length)}
 });
 return [...new Set(idx)].sort((a,b)=>a-b);
}
function focusExcerpt(text){
 text=String(text||'');
 if(text.length<=520) return text;
 const pos=relevantIndexes(text);
 if(!pos.length) return text.slice(0,500).trim()+'…';
 const ranges=[];
 for(const p of pos){
  let a=Math.max(0,p-105), b=Math.min(text.length,p+190);
  while(a>0 && !/\s/.test(text[a-1]) && p-a<135) a--;
  while(b<text.length && !/\s/.test(text[b]) && b-p<220) b++;
  const last=ranges[ranges.length-1];
  if(last && a<=last[1]+45) last[1]=Math.max(last[1],b);
  else ranges.push([a,b]);
  if(ranges.length>=3) break;
 }
 let out=ranges.map(([a,b])=>`${a>0?'… ':''}${text.slice(a,b).trim()}${b<text.length?' …':''}`).join(' ');
 if(out.length>520) out=out.slice(0,515).trimEnd()+'…';
 return out;
}

 if(mediaFilter!=='ALL')p=p.filter(x=>x.media_type===mediaFilter);
 const q=query.trim().toLowerCase();
 if(q)p=p.filter(x=>[x.text,x.text_ko,x.author,x.handle,...(x.q1||[]),...(x.q2||[]),...(x.keywords||[]),...(x.mentioned_songs||[]),...(x.media_songs||[])].join(' ').toLowerCase().includes(q));
 p=sorted(p);
 $('total').textContent=`${p.length}개 게시물`;
 $('list').innerHTML=p.map(x=>card(x,'all')).join('')||'<div>결과 없음</div>';
}
$('search').addEventListener('input',e=>{query=e.target.value;renderList()});
$('sort').addEventListener('change',e=>{sortMode=e.target.value;renderList()});
function placeSections(){
 const dyn=$('dynamicSection'), lang=$('langSection'), tweets=$('tweetsSection');
 if(!dyn||!lang||!tweets) return;
 if(market==='ALL'){
  tweets.parentNode.insertBefore(dyn,tweets);
 }else{
  lang.parentNode.insertBefore(dyn,lang);
 }
}
function render(){
 document.querySelectorAll('.isActive').forEach(el=>el.classList.remove('isActive'));
 previewOrigins.p1=previewOrigins.p2=previewOrigins.p3=null;
 activePreviewTarget=null;
 placeSections();
 renderTabs();renderOverview();renderQ1();renderDynamic();renderLang();renderMediaFilters();renderList();
 $('p1').innerHTML='';$('p2').innerHTML='';$('p3').innerHTML='';
 updateFloatButton();
}
render();
const toTop=$('toTop');
window.addEventListener('scroll',()=>{
 if(!toTop) return;
 toTop.classList.toggle('show',window.scrollY>650);
},{passive:true});
if(toTop) toTop.addEventListener('click',()=>{if(activePreviewTarget&&previewOrigins[activePreviewTarget]) returnToOrigin(activePreviewTarget); else window.scrollTo({top:0,behavior:smoothBehavior()});});
</script>
</body>
